plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.23'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name "Modmaven"
        url "https://modmaven.dev"
        content {
            // GrandPower
            includeGroup "dev.technici4n"
            // Modern Industrialization
            includeGroup "aztech"
            // Tesseract
            includeGroup "net.swedz"
        }
    }

    maven {
        name "shedaniel"
        url "https://maven.shedaniel.me"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        url "https://maven.architectury.dev/"
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
        content {
            includeGroup "org.parchmentmc.data"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }

    maven {
        url "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }

    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        name "TerraformersMC"
        url "https://maven.terraformersmc.com/releases/"
        content {
            // EMI
            includeGroup "dev.emi"
        }
    }

    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            programArguments.addAll '--username', 'White_Phant0m', '--uuid', 'f83bd929-fbf0-4186-becb-658d676fcc42'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation ("aztech:Modern-Industrialization:${modern_industrialization_version}")
    implementation ("dev.technici4n:GrandPower:${grandpower_version}")
    implementation ("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")

    compileOnly ("org.appliedenergistics:appliedenergistics2:${ae2_version}:api")
    runtimeOnly ("org.appliedenergistics:appliedenergistics2:${ae2_version}")

    runtimeOnly ("net.swedz:tesseract-api-neoforge:${tesseract_version}-${minecraft_version}")
    runtimeOnly ("net.swedz:extended-industrialization:${extended_industrialization_version}-${minecraft_version}")

    runtimeOnly ("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")
    runtimeOnly ("dev.architectury:architectury-neoforge:${architectury_version}")
    runtimeOnly ("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}")
    runtimeOnly ("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    runtimeOnly ("curse.maven:glodium-957920:5821676")
    runtimeOnly ("curse.maven:ex-pattern-provider-892005:6251183")
    runtimeOnly ("curse.maven:jade-324717:5639932")

    runtimeOnly ("curse.maven:xycraft-653786:6872525")
    runtimeOnly ("curse.maven:xycraft-world-653789:6872532")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            ae2_version_range      : ae2_version_range,
            mi_version_range       : modern_industrialization_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.jar {
    exclude("**/datagen/**")
    exclude(".cache")
}
